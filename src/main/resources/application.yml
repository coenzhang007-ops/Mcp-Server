server:
  port: 8088

mcp:
  public-base-url: http://127.0.0.1:8088
  sse:
    enabled: false

spring:
  application:
    name: mcp-server-demo
  main:
    banner-mode: off

crm:
  api:
    base-url: https://api-crm.v-buy.com/uac
    auth-header-name: authorization
    auth-prefix: "Bearer "

logging:
  level:
    root: WARN
    org.springframework.ai: WARN
    com.example.mcp: INFO
