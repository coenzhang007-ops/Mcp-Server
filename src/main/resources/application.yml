server:
  port: 8088

spring:
  application:
    name: mcp-server-demo
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        name: mcp-server-demo
        version: 1.0.0
        type: SYNC
        stdio: false
        base-url: http://127.0.0.1:8088
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message

crm:
  api:
    base-url: http://192.168.1.250:9999/uac
    auth-header-name: authorization
    auth-prefix: "Bearer "

logging:
  level:
    root: ERROR
    org.springframework.ai: ERROR
    com.example.mcp: ERROR
